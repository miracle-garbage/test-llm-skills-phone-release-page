      <a class="nav__logo" href="#hero" aria-label="NOVA 首页" data-scroll-to="#hero">
        <span class="nav__mark">N</span><span class="nav__word">NOVA</span>

      <nav class="nav__links" aria-label="主导航">
        <a href="#design" data-scroll-to="#design"><i>01</i>设计</a>

        <a href="#camera" data-scroll-to="#camera"><i>03</i>影像</a>
